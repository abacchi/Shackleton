<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" role="img" aria-labelledby="map-title">
  <title id="map-title">The route of the Endurance expedition, 1914–1916</title>

  <defs>
    <radialGradient id="oceanGrad" cx="50%" cy="50%" r="75%">
      <stop offset="0%" stop-color="#101822"/>
      <stop offset="100%" stop-color="#070a0e"/>
    </radialGradient>
    <pattern id="grid" width="50" height="50" patternUnits="userSpaceOnUse">
      <path d="M 50 0 L 0 0 0 50" fill="none" stroke="#1a222c" stroke-width="0.5"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#d9e3ee"/>
    </marker>
    <marker id="arrowRed" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#c97b6a"/>
    </marker>
    <marker id="arrowAmber" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#d9b066"/>
    </marker>
  </defs>

  <!-- Ocean -->
  <rect width="800" height="800" fill="url(#oceanGrad)"/>
  <rect width="800" height="800" fill="url(#grid)"/>

  <!-- Antarctic Peninsula + Continent (highly stylized) -->
  <path d="M 0 800 L 0 600 Q 80 540 180 500 Q 250 460 288 338 Q 305 380 340 420 Q 420 480 520 540 Q 640 600 800 640 L 800 800 Z"
        fill="#1c2530" stroke="#2e3a47" stroke-width="1"/>

  <!-- South Georgia island -->
  <ellipse cx="611" cy="68" rx="28" ry="6" fill="#1c2530" stroke="#2e3a47" stroke-width="1" transform="rotate(-25 611 68)"/>

  <!-- Elephant Island -->
  <circle cx="317" cy="280" r="5" fill="#1c2530" stroke="#2e3a47" stroke-width="1"/>

  <!-- ROUTE: Endurance south from S. Georgia to trap point (solid white) -->
  <path d="M 611 68 Q 680 350 688 754" fill="none" stroke="#d9e3ee" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Ice drift: trap point to sinking to Patience Camp (dashed) -->
  <path d="M 688 754 Q 540 700 420 600 Q 360 560 360 508 Q 350 410 344 292"
        fill="none" stroke="#7da3c9" stroke-width="2" stroke-dasharray="4 5" marker-end="url(#arrow)"/>

  <!-- Boat journey to Elephant Island (amber) -->
  <path d="M 344 292 L 317 280" fill="none" stroke="#d9b066" stroke-width="2.5" marker-end="url(#arrowAmber)"/>

  <!-- James Caird to South Georgia (red) -->
  <path d="M 317 280 Q 440 140 611 68" fill="none" stroke="#c97b6a" stroke-width="2.5" marker-end="url(#arrowRed)"/>

  <!-- Yelcho rescue back to Elephant Island (thin gray dashed) -->
  <path d="M 611 68 Q 460 160 320 285" fill="none" stroke="#6a7480" stroke-width="1" stroke-dasharray="2 4"/>

  <!-- Labels -->
  <g font-family="Helvetica Neue, Arial, sans-serif" fill="#e8eaed" font-size="14">
    <text x="640" y="62">South Georgia</text>
    <text x="640" y="80" font-size="10" fill="#9aa3ad" font-style="italic">Stromness whaling station</text>

    <text x="330" y="275">Elephant Island</text>
    <text x="330" y="291" font-size="10" fill="#9aa3ad" font-style="italic">15 Apr 1916 — 30 Aug 1916</text>

    <text x="700" y="748" text-anchor="end">Endurance trapped</text>
    <text x="700" y="765" text-anchor="end" font-size="10" fill="#9aa3ad" font-style="italic">19 Jan 1915 — Vahsel Bay</text>

    <text x="372" y="510">Endurance crushed</text>
    <text x="372" y="526" font-size="10" fill="#9aa3ad" font-style="italic">21 Nov 1915</text>

    <text x="120" y="640" fill="#5b6772" font-size="20" letter-spacing="6">ANTARCTICA</text>
  </g>

  <!-- Compass rose -->
  <g transform="translate(60 80)" font-family="Helvetica Neue, Arial, sans-serif" fill="#9aa3ad" font-size="10">
    <circle r="22" fill="none" stroke="#2e3a47"/>
    <path d="M 0 -22 L 0 22 M -22 0 L 22 0" stroke="#2e3a47"/>
    <text x="-3" y="-26">N</text>
    <text x="-3" y="34">S</text>
    <text x="-30" y="3">W</text>
    <text x="26" y="3">E</text>
  </g>

  <!-- Legend -->
  <g transform="translate(40 720)" font-family="Helvetica Neue, Arial, sans-serif" font-size="11" fill="#9aa3ad">
    <rect x="-10" y="-50" width="280" height="70" fill="#0a0d12" stroke="#2e3a47"/>
    <line x1="0" y1="-32" x2="24" y2="-32" stroke="#d9e3ee" stroke-width="2"/>
    <text x="32" y="-29">Endurance under sail</text>
    <line x1="0" y1="-15" x2="24" y2="-15" stroke="#7da3c9" stroke-width="2" stroke-dasharray="4 5"/>
    <text x="32" y="-12">Drift in the ice</text>
    <line x1="0" y1="2" x2="24" y2="2" stroke="#d9b066" stroke-width="2"/>
    <text x="32" y="5">Boats to Elephant I.</text>
    <line x1="140" y1="-15" x2="164" y2="-15" stroke="#c97b6a" stroke-width="2"/>
    <text x="172" y="-12">James Caird voyage</text>
    <line x1="140" y1="2" x2="164" y2="2" stroke="#6a7480" stroke-width="1" stroke-dasharray="2 4"/>
    <text x="172" y="5">Yelcho rescue</text>
  </g>
</svg>
